name: Renovate

# Scheduled self-hosted Renovate runner, replacing Dependabot (see
# renovate.json at the repo root for the base config). Mints a short-lived
# GitHub App (dk-renovate-bot) installation token so Renovate's commits/PRs
# are attributed to the App — not GITHUB_TOKEN — which lets its PRs trigger
# the required checks and be auto-merged via native branch-protection
# auto-merge once that's wired up.
#
# Helm is installed in the runner per R32: the upcoming dual-stream chart
# tracking (helmv3 manager with postUpdateOptions:
# ["helmUpdateSubChartArchives"]) shells out to `helm dependency build` to
# regenerate the vendored charts/*.tgz + Chart.lock in the same PR (R24),
# mirroring the existing revendor-helm-charts.yaml workflow's use of Helm.
#
# Hardening:
#   - every `uses:` is pinned to a full commit SHA (trailing comment records
#     the version tag);
#   - permissions default to `contents: read` — Renovate authenticates against
#     GitHub with the minted App token, so the workflow's own GITHUB_TOKEN
#     never needs write access;
#   - RENOVATE_REPOSITORIES pins the run to this repo only, so the (shared)
#     App installation on the dashboard repo can't leak into this schedule.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  # Renovate's rebase/retry checkbox (PR body) and the Dependency Dashboard
  # checkboxes (issue body) are just edits to markdown -- a self-hosted runner
  # only notices them on its next scheduled run. Firing on `edited` makes a tick
  # take effect immediately; the job-level `if` below keeps it to actual ticks.
  #
  # `pull_request_target` (not `pull_request`) so the workflow definition is
  # always read from main rather than from the PR's head branch: PRs opened
  # before this change would otherwise never carry the trigger. It never checks
  # out PR content, and GITHUB_TOKEN stays `contents: read` (Renovate itself
  # authenticates with the minted App token), so the usual pull_request_target
  # privilege-escalation footgun does not apply.
  pull_request_target:
    types: [edited]
  issues:
    types: [edited]

permissions:
  contents: read

# Never let a checkbox-triggered run race the nightly schedule (or another
# checkbox); Renovate is not safe to run concurrently against one repo.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Only act on a *ticked* box on one of our own bot's PRs/dashboard issue.
    # Renovate unticks the box as it processes it, so the resulting edit event
    # has no `- [x]` left and the workflow does not re-trigger itself.
    if: >-
      (github.event_name != 'pull_request_target' && github.event_name != 'issues') ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.login == 'dk-renovate-bot[bot]' &&
        contains(github.event.pull_request.body, '- [x] <!-- rebase-check -->')) ||
      (github.event_name == 'issues' &&
        github.event.issue.user.login == 'dk-renovate-bot[bot]' &&
        contains(github.event.issue.body, '- [x]'))
    steps:
      - name: Generate a token for the dk-renovate-bot App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Run Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: debug
          LOG_FORMAT: json
          # Attribute Renovate's commits/PRs to the App bot instead of the
          # action's default "renovate-bot" identity. The email must use the
          # App bot's numeric user id (resolved via
          # `gh api users/dk-renovate-bot%5Bbot%5D`) for GitHub to recognize
          # it as a real account and render the App's avatar on the commit.
          RENOVATE_GIT_AUTHOR: "dk-renovate-bot[bot] <300303047+dk-renovate-bot[bot]@users.noreply.github.com>"
        with:
          token: ${{ steps.app-token.outputs.token }}

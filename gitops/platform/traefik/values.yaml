# Traefik (R23, ADR 0004), values under the `traefik:` subchart key. One chart
# does three jobs via native upstream values: the proxy Deployment + its
# data-plane LoadBalancer Service (the single Always Free OCI *network* LB —
# see the service block below for why it is no longer the classic flexible
# LB), the `traefik` GatewayClass, and the shared `Gateway` with HTTP :80
# (chart default) + HTTPS :443 listeners.
traefik:
  # Gateway API implementation (R23): enable the kubernetesGateway provider so
  # Traefik watches Gateway/HTTPRoute and owns the GatewayClass + Gateway below
  # (gatewayClass.enabled / gateway.enabled are chart defaults; restated for
  # visibility since they're load-bearing for R23).
  providers:
    kubernetesGateway:
      enabled: true
  gatewayClass:
    enabled: true
  gateway:
    enabled: true
    listeners:
      # HTTP :80 stays a chart default (cert-manager's HTTP-01 challenge solves
      # through an HTTPRoute on it). HTTPS :443 added here for R23;
      # certificateRefs names the Secret(s) cert-manager populates, decoupling
      # routing from the cert-manager rollout. Each public workload owns its own
      # host cert Secret and adds it here; Traefik selects the right one per SNI,
      # so apps don't fight over a single shared Secret:
      #   - proof-app-tls (ns proof-app)        -> proof.<baseDomain>   (proof-app, migrated to
      #                                            generic-app-chart — R32 — so its Certificate now
      #                                            renders in its own namespace; cross-namespace per
      #                                            ADR 0001, hence the explicit `namespace` below)
      #   - change-tracking-dashboard-tls (ns change-tracking-dashboard) -> changes.<baseDomain>
      #                                            (change-tracking-dashboard, migrated to
      #                                            generic-app-chart — ctd-migrate-retire — so its
      #                                            Certificate now renders in its own namespace too;
      #                                            cross-namespace per ADR 0001, hence the explicit
      #                                            `namespace` below)
      #   - consulting-spa-tls (ns consulting-spa) -> consulting.<baseDomain>
      #                                            (consulting-spa, deployed fresh onto
      #                                            generic-app-chart — #65 — so its Certificate renders
      #                                            in its own namespace; cross-namespace per ADR 0001,
      #                                            hence the explicit `namespace` below)
      #   - resume-website-tls (ns resume-website) -> me.<baseDomain>
      #                                            (resume-website, deployed fresh onto
      #                                            generic-app-chart like consulting-spa, so its
      #                                            Certificate renders in its own namespace;
      #                                            cross-namespace per ADR 0001, hence the explicit
      #                                            `namespace` below)
      #
      # NOTE: the old `traefik-gateway-tls` Secret (this `traefik` namespace)
      # is now orphaned by the R32 migration above — cert-manager does not
      # garbage-collect a Secret when its owning Certificate is deleted, by
      # default. Safe for the operator to manually delete once the proof-app
      # migration is confirmed live.
      #
      # namespacePolicy renders directly into this listener's Gateway API
      # allowedRoutes.namespaces (see the upstream chart's templates/gateway.yaml).
      # Unset, it defaults to Gateway API's own default (Same) — only Routes in
      # this Gateway's own namespace (traefik) could attach. Both workloads on
      # this lab (proof-app, R32; change-tracking-dashboard, ctd-migrate-retire)
      # have now moved to the app-owned model below, with their own
      # HTTPRoute/Certificate in each workload's own namespace instead of
      # traefik's.
      #
      # `Selector` (not the broader `All`) opts in only namespaces carrying the
      # `gateway-access: "true"` label — every workload namespace gets it
      # automatically via the `workloads` ApplicationSet's
      # managedNamespaceMetadata (applicationsets/workloads.yaml), and this
      # Gateway's own `traefik` namespace still carries it too via the
      # `platform` ApplicationSet (gitops/platform/traefik/config.yaml's
      # gatewayAccess flag) — left as configured, unaddressed by this
      # migration, even though no workload now needs a same-namespace Route
      # there. No other platform namespace (argocd, cert-manager,
      # longhorn-system, ...) is labeled, so this stays scoped to exactly the
      # namespaces that need internet-facing routing, not every namespace in
      # the cluster (`All`).
      # This is the platform-side prerequisite for
      # personal-generic-app-chart's app-owned-routing model — each workload
      # owns its own HTTPRoute/Certificate in its own namespace instead of
      # writing into traefik's (see that repo's
      # docs/adr/0001-gateway-cross-namespace-routing.md). proof-app (R32) and
      # change-tracking-dashboard (ctd-migrate-retire) are both on this model now.
      web:
        namespacePolicy:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
      websecure:
        port: 8443
        protocol: HTTPS
        mode: Terminate
        namespacePolicy:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
        certificateRefs:
          - kind: Secret
            name: change-tracking-dashboard-tls
            namespace: change-tracking-dashboard
          - kind: Secret
            name: consulting-spa-tls
            namespace: consulting-spa
          - kind: Secret
            name: resume-website-tls
            namespace: resume-website
  # Data-plane Service stays LoadBalancer (chart default), but is now backed by
  # an OCI *Network* Load Balancer (L4) rather than the classic flexible LB.
  # Two reasons, in order of importance:
  #
  #  1. Client source IP. The classic LB proxies every connection, so the
  #     source address arriving in-cluster was the LB's, not the visitor's.
  #     And because Traefik terminates TLS itself (the websecure listener
  #     above), that LB ran a plain TCP listener — it could not inject an
  #     X-Forwarded-For to compensate. Every request reached the workloads
  #     anonymous. The NLB preserves the original address in the IP packet
  #     header (is-preserve-source), which is what makes per-visitor and geo
  #     dimensions possible in the workloads' telemetry at all.
  #  2. Bandwidth. The classic LB was pinned to the free-tier flexible shape's
  #     10 Mbps cap. Always Free covers one classic flexible LB *and* one
  #     network LB as separate entitlements, so moving does not spend the
  #     allowance twice — and the NLB is not bandwidth-shaped, so the cap goes
  #     away with it.
  #
  # is-preserve-source is honored only when externalTrafficPolicy is Local; OCI
  # rejects the annotation outright under Cluster. Local is also the other half
  # of why the address survives — kube-proxy stops SNATing to a node address —
  # and it stops the NLB forwarding to nodes with no Traefik pod, which is what
  # deployment.replicas below exists to keep from becoming a rollout outage.
  service:
    annotations:
      oci.oraclecloud.com/load-balancer-type: "nlb"
      oci-network-load-balancer.oraclecloud.com/is-preserve-source: "true"
    # spec merges over the chart's default; type restated because it is
    # load-bearing and now sits next to a sibling key.
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Local
  # A second replica is required by externalTrafficPolicy: Local above, not
  # wanted for its own sake. Under Local the NLB forwards only to nodes
  # actually running a Traefik pod, so with a single replica every rolling
  # update is a brief ingress outage: the pod moves node, and traffic resumes
  # only once the NLB health check re-marks the new node healthy (~10s at the
  # 3s interval / 3 retry defaults). A second replica keeps one healthy backend
  # throughout the rollout.
  deployment:
    replicas: 2
  # Spread those replicas across nodes, since two pods on one node would leave
  # exactly the single-node-outage this is meant to avoid. Deliberately
  # `preferred` and not `required`: this lab is small enough to be a
  # single-node cluster, where a hard constraint would leave the second replica
  # Pending forever and make rollouts worse, not better.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

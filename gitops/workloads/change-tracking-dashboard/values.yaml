# change-tracking-dashboard (ctd-migrate-retire): the second workload (after
# proof-app, R32) migrated onto generic-app-chart's full app-owned
# routing/TLS model end-to-end — git -> ArgoCD -> Gateway -> live HTTPS. This
# is a live, stateful production app (real PVC, real SQLite change-history
# data, real HTTPS traffic at changes.dackota.com); every value below
# replicates the vendored bespoke chart's live behavior exactly. Values nest
# under the `generic-app-chart:` dependency key (Helm's standard
# subchart-values convention).
generic-app-chart:
  # Keeps every rendered resource named "change-tracking-dashboard" instead
  # of the chart's default "change-tracking-dashboard-generic-app-chart"
  # (R2: <release>-<chart>) — matches the resource names the bespoke chart
  # already rendered live.
  fullnameOverride: change-tracking-dashboard

  # CRITICAL, load-bearing: without this, generic-app-chart.selectorLabels
  # renders `app.kubernetes.io/name: generic-app-chart` (the chart's own
  # name), but the live Deployment created by the bespoke chart already has
  # an immutable spec.selector of `app.kubernetes.io/name:
  # change-tracking-dashboard`. Kubernetes rejects any Deployment update
  # that changes spec.selector, so ArgoCD gets stuck retrying forever, and
  # the Service (whose selector *does* update, since Service selectors are
  # mutable) ends up with zero matching endpoints — a live outage,
  # discovered the hard way during this migration's rollout. nameOverride
  # keeps the selector identical to the pre-existing one so the update
  # applies as a normal in-place patch instead. Any future live-app
  # migration onto this chart (not a fresh deployment) must set this to the
  # previous chart's name.
  nameOverride: change-tracking-dashboard

  image:
    # Renovate tracks this tag via its built-in helm-values manager (the
    # repository/tag pair below is all it needs); a custom regex manager used
    # to double-manage this same line, which broke digest pinning — the regex
    # manager captured no currentDigest group, so `pinDigests` (inherited from
    # config:best-practices) failed to write one and errored the whole
    # pin-dependencies branch.
    repository: ghcr.io/dackota/change-tracking-dashboard
    tag: "0.18.6@sha256:aeee94bf324f76d9ea842b405f7de362ed4a5bedd1657375b43b153f61ebdd39"

  # The app process runs as uid/gid 65534 ("nobody"), as the bespoke chart
  # hardcoded; generic-app-chart's own default is 10001. Setting these (with
  # fsGroup 65534) makes the kubelet chown the freshly provisioned Longhorn
  # volume to the app's uid/gid so it can read/write /data (see persistence
  # below).
  podSecurityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534

  # The 3 env vars the bespoke chart hardcoded (not configurable there
  # either) — reproduced verbatim.
  env:
    - name: CONFIG_PATH
      value: /etc/dashboard/config.yaml
    - name: DB_PATH
      value: /data/changes.db
    - name: LISTEN_ADDR
      value: ":8080"

    # Telemetry export + span dimensions (dackota/change-tracking-dashboard#198).
    #
    # A bare host:443 endpoint selects TLS in the app's parseEndpoint, so no
    # scheme is needed; the API key becomes the x-honeycomb-team export header.
    # Secrets are pre-created out-of-band in this namespace, matching the
    # resume-website pattern: honeycomb-api-key (key HONEYCOMB_API_KEY) and
    # visitor-id-salt (key VISITOR_ID_SALT).
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "api.honeycomb.io:443"
    - name: HONEYCOMB_API_KEY
      valueFrom:
        secretKeyRef:
          name: honeycomb-api-key
          key: HONEYCOMB_API_KEY

    # Enables the visitor.id span attribute (a daily-rotating salted hash of
    # client address + user agent). An empty salt disables the attribute
    # outright rather than falling back to an unsalted hash, and the salt must
    # stay identical across replicas or the same person derives a different id
    # per pod and the distinct count multiplies.
    - name: VISITOR_ID_SALT
      valueFrom:
        secretKeyRef:
          name: visitor-id-salt
          key: VISITOR_ID_SALT

    # X-Forwarded-For is attacker-controlled on a directly reachable service,
    # so the app only honors it when told to. This workload is reachable only
    # through the shared Traefik Gateway, which sets the header itself.
    #
    # Until the OCI network LB (PR #134) fully replaces the classic LB, the
    # address Traefik sees is a node IP rather than the real client, so
    # visitor.id will under-count (roughly one visitor per node) even with this
    # set. The wiring is correct now; the numbers become meaningful after that
    # cutover. Geo attributes stay off: GEO_COUNTRY_HEADER / GEO_REGION_HEADER
    # / GEO_CITY_HEADER are deliberately unset until a Traefik MaxMind plugin
    # exists to populate those headers.
    - name: TRUST_FORWARDED_FOR
      value: "true"

  service:
    ports:
      - name: http
        port: 8080
        targetPort: 8080
        protocol: TCP

  # Probes target /healthz, not /.
  #
  # /healthz is the app's dependency-free liveness route, and the app's
  # telemetry middleware marks it a quiet route so probe traffic does not
  # emit a request log line ~10x/minute.
  #
  # Probing / (the full timeline page) produced a steady stream of ERROR logs:
  # kubelet closes the probe connection as soon as it has the status code and
  # never drains the body, so every probe aborted the template write mid-body
  # and the handler logged "web: render timeline template: write tcp ...:
  # broken pipe / connection reset by peer". Probing / also ran the timeline's
  # store queries on every probe for no diagnostic benefit.
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # The bespoke chart's own chart-level default was 50m/64Mi; the gitops values
  # overrode requests to 25m.
  #
  # cpu request was raised 25m -> 75m because this is not a steady 1-2m
  # workload: pre-fix, each poll cycle saturated its 200m limit for ~3m22s
  # (sampled every 15s in prod, 199-200m the whole way), averaging ~70m over a
  # 600s interval — a ~34% duty cycle the scheduler had no idea about at a 25m
  # request. dackota/change-tracking-dashboard#137 was the cause (the poller
  # re-walked each file's git history once per tracked field).
  #
  # #137 shipped in v0.13.2, so 75m is now conservative: the heaviest possible
  # cycle (startup clone + 90-day backfill) measured ~80s at 200m, so ~27m
  # average over the 600s interval restored below, and steady polls are
  # cheaper still. Left at 75m deliberately until a few steady-state cycles
  # have been sampled at the restored interval — dropping it toward 25m is a
  # separate, better-measured change.
  #
  # The 200m limit is deliberately left alone. The poller is a background batch
  # job, so throttling it is the correct outcome on a 2-node Always-Free
  # cluster — raising the limit would just let it take a bigger bite out of the
  # node during its burst.
  resources:
    requests:
      cpu: 75m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # The chart owns this PVC: generic-app-chart renders a PersistentVolumeClaim
  # named after the chart fullname (change-tracking-dashboard; 1Gi, Longhorn,
  # RWO) and mounts it at /data. Because the PVC is now part of the rendered
  # source, ArgoCD reconciles it in place and the Application stays InSync —
  # no more out-of-source PVC, and no git-invisible
  # argocd.argoproj.io/sync-options: Prune=false annotation to maintain by
  # hand (the pre-existingClaim design that left this app permanently
  # OutOfSync).
  #
  # The dashboard's SQLite change-history DB (/data/changes.db) is fully
  # regenerable: on startup the poller re-clones this repo (into ephemeral
  # storage, not /data) and backfills up to backfillDays of history (see
  # config.yaml), so a fresh empty volume rebuilds the entire feed. That makes
  # the volume disposable — migrating off the old change-tracking-dashboard-data
  # PVC (deleting it and letting the chart provision this one) costs only a
  # brief re-backfill, not real data loss.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: longhorn
    mountPath: /data

  # Tracker config (hot-reloaded), moved verbatim from the bespoke chart's
  # ConfigMap into this chart's generic `config` value. Rendered into a
  # ConfigMap named after this chart's fullname (no suffix) — mounted below
  # via extraVolumes/extraVolumeMounts since generic-app-chart's `config`
  # only renders the ConfigMap, it doesn't auto-mount it.
  config:
    config.yaml: |
      defaults:
        pollIntervalSeconds: 600
        backfillDays: 90
      trackers:
        - repo: https://github.com/dackota/free-tier-oracle-cloud-k8s.git
          facetRegex: "gitops/(?P<layer>platform|workloads)/(?P<component>[^/]+)/"
          files:
            - glob: "gitops/*/*/Chart.yaml"
              fields:
                - name: chartDependencies
                  # `// []` guards charts with no dependencies: block (e.g.
                  # cluster-issuers, gateway-api-crds) — map over null errors.
                  expr: '(.dependencies // []) | map({(if .alias then .alias else .name end): .version}) | add'
            - glob: "gitops/*/*/values.yaml"
              fields:
                - name: imageTags
                  # Type-guard each entry so top-level scalar values (e.g. an
                  # `email:`/`domain:` string) are skipped instead of erroring
                  # on `.value.image` — jq `and` short-circuits before indexing.
                  expr: 'to_entries | map(select((.value | type) == "object" and (.value.image | type) == "object" and .value.image.tag != null)) | map({(.key): .value.image.tag}) | add'
            # Terraform/OCI infra. This tracker's `engine` is unset, so the
            # poller auto-detects the extractor per-glob from the file suffix
            # (extractor.InferEngine): the `.tf` glob selects the `hcl` engine
            # while the Chart.yaml/values.yaml globs above stay on jq. HCL
            # `expr`s are structural traversal paths (block type + labels ->
            # attribute), NOT jq. Each field resolves to a single scalar; a
            # path that doesn't exist in a given .tf file is recorded as absent
            # (no spurious change), so one glob + all fields is safe even
            # though each field lives in only one file. Verified against the
            # live files with the hclextract engine before committing.
            #
            # Field NAMES are deliberately kebab-case (not this repo's usual
            # camelCase): the dashboard's compiled-in risk classifier
            # (changeset.DefaultRiskRules) matches word-boundaried regexes
            # against the field name — e.g. `\bocpus?\b`, `\bsize\b`,
            # `boot[_-]?volume`, `node[_-]?shape\b` — so `node-pool-ocpus`
            # trips the "cost tripwire" badge while a camelCase `nodeOcpus`
            # (no internal word boundary) would NOT. Names echo the underlying
            # HCL attribute, matching the classifier's shipped OCI conventions.
            - glob: "terraform/*.tf"
              fields:
                # Provider + Terraform version pins (versions.tf) — the surface
                # renovate bumps (e.g. PR #46, oci -> v8). No risk badge (a
                # provider bump isn't a cost/security/replace signal).
                - name: terraform-required-version
                  expr: "terraform.required_version"
                - name: oci-provider-version
                  expr: "terraform.required_providers.oci.version"
                - name: helm-provider-version
                  expr: "terraform.required_providers.helm.version"
                - name: kubectl-provider-version
                  expr: "terraform.required_providers.kubectl.version"
                # OKE control-plane Kubernetes version (oci-containerengine-cluster.tf)
                # — pinned literal; upgrades are deliberate, reviewed changes
                # (e.g. the v1.36.1 bump), exactly the kind of change to surface.
                - name: kubernetes-version
                  expr: "resource.oci_containerengine_cluster.main.kubernetes_version"
                # Always-Free node-pool cost tripwires (oci-containerengine-nodepool.tf):
                # node count, shape, per-node OCPU/memory, and boot volume size.
                # Any change here risks breaching the free-tier allowance, so
                # they are the highest-signal infra fields to watch. node-shape
                # trips the "replace/destroy" risk badge (a shape change forces
                # node replacement); the rest trip "cost tripwire".
                - name: node-pool-size
                  expr: "resource.oci_containerengine_node_pool.main.node_config_details.size"
                - name: node-shape
                  expr: "resource.oci_containerengine_node_pool.main.node_shape"
                - name: node-pool-ocpus
                  expr: "resource.oci_containerengine_node_pool.main.node_shape_config.ocpus"
                - name: node-pool-memory-in-gbs
                  expr: "resource.oci_containerengine_node_pool.main.node_shape_config.memory_in_gbs"
                - name: node-pool-boot-volume-size
                  expr: "resource.oci_containerengine_node_pool.main.node_source_details.boot_volume_size_in_gbs"

        # Two field shapes recur across all three, so they are defined the same
        # way everywhere:
        #
        #   released-version — .release-please-manifest.json is the single
        #     source of truth release-please writes the current version into on
        #     every release PR merge, so it changes exactly once per release,
        #     with the release commit. `.["."]` is the root package key (all
        #     three repos are single-package, include-component-in-tag: false).
        #
        #   github-action-pins — every `uses:` in these repos is pinned to a
        #     full commit SHA, and Renovate bumps those SHAs. The expr collects
        #     the whole workflow's pins into one keyed field
        #     (action -> sha) so a workflow's supply-chain surface shows up as
        #     a single row instead of one field per action. `.steps[]?` (not
        #     `.steps[]`) tolerates jobs that have no steps — a job calling a
        #     reusable workflow via a job-level `uses:` — and
        #     `select(length > 1)` drops local composite actions
        #     (`./.github/actions/x`), which have no `@sha` half and would
        #     otherwise record a null value.
        #
        # Field names are kebab-case for the same reason as the terraform
        # fields above (the risk classifier matches word-boundaried regexes);
        # neither of these trips a built-in rule today, which is correct — a
        # release bump or an action SHA bump is not a cost/replace/security
        # signal on its own.
        #
        # facetRegex captures the workflow filename so the timeline's facet
        # filter can narrow to a single workflow. Files outside
        # .github/workflows (the manifest, Chart.yaml) simply match nothing and
        # get an empty facet map — facet.ExtractFacets never errors on a
        # non-match.
        - repo: https://github.com/dackota/change-tracking-dashboard.git
          facetRegex: "\\.github/workflows/(?P<workflow>[^/]+)\\.ya?ml$"
          files:
            - glob: ".release-please-manifest.json"
              fields:
                - name: released-version
                  expr: '.["."]'
            - glob: ".github/workflows/*.yml"
              fields:
                - name: github-action-pins
                  expr: '[.jobs[]?.steps[]?.uses] | map(select(. != null)) | map(split("@")) | map(select(length > 1)) | map({(.[0]): .[1]}) | add'
        # generic-app-chart also gets its Chart.yaml tracked: this is the chart
        # every workload in this repo depends on (see each workload's
        # Chart.yaml `dependencies`), so its version is the upstream side of
        # the chartDependencies field already tracked above — a bump here is
        # what the gitops-repo Renovate PR later reacts to. A 1.x -> 2.x jump
        # in `chart-version` trips the built-in semver-major-bump risk rule.
        - repo: https://github.com/dackota/generic-app-chart.git
          facetRegex: "\\.github/workflows/(?P<workflow>[^/]+)\\.ya?ml$"
          files:
            - glob: "Chart.yaml"
              fields:
                - name: chart-version
                  expr: ".version"
                - name: chart-app-version
                  expr: ".appVersion"
                # The minimum cluster version the chart targets. Worth
                # watching against the tracked OKE kubernetes-version above:
                # if this floor ever rises past the cluster, the chart stops
                # being installable here.
                - name: chart-kube-version
                  expr: ".kubeVersion"
            - glob: ".release-please-manifest.json"
              fields:
                - name: released-version
                  expr: '.["."]'
            - glob: ".github/workflows/*.yml"
              fields:
                - name: github-action-pins
                  expr: '[.jobs[]?.steps[]?.uses] | map(select(. != null)) | map(split("@")) | map(select(length > 1)) | map({(.[0]): .[1]}) | add'
        - repo: https://github.com/dackota/resume-website.git
          facetRegex: "\\.github/workflows/(?P<workflow>[^/]+)\\.ya?ml$"
          files:
            - glob: ".release-please-manifest.json"
              fields:
                - name: released-version
                  expr: '.["."]'
            - glob: ".github/workflows/*.yml"
              fields:
                - name: github-action-pins
                  expr: '[.jobs[]?.steps[]?.uses] | map(select(. != null)) | map(split("@")) | map(select(length > 1)) | map({(.[0]): .[1]}) | add'

      # Config-driven risk rules (change-tracking-dashboard PR #120). These are
      # APPENDED to the app's built-in DefaultRiskRules, not a replacement — the
      # shipped OCI cost/replace/security rules and the provider-agnostic
      # semver-major-bump rule (which already flags any chart/image 1.x -> 2.x
      # jump) all still apply. This block adds the one high-signal infra change
      # the built-ins don't cover: a deliberate OKE control-plane Kubernetes
      # upgrade (e.g. the real v1.36.0 -> v1.36.1 bump already in this repo's
      # history). Safely ignored by app images that predate the feature —
      # unknown top-level YAML keys are skipped, not rejected.
      riskRules:
        - name: kubernetes-control-plane-upgrade
          risk: control-plane upgrade
          fieldPattern: ^kubernetes-version$
          changeTypes: [modified]

  extraVolumes:
    - name: config
      configMap:
        name: change-tracking-dashboard
  extraVolumeMounts:
    - name: config
      mountPath: /etc/dashboard
      readOnly: true

  # R21-R23: expose over HTTPS through the lab's one shared Traefik Gateway,
  # in this app's own namespace (ADR 0001 app-owned routing/TLS model). The
  # live, already-working hostname — unchanged by this migration.
  routing:
    enabled: true
    hostnames:
      - changes.dackota.com
    gateway:
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    tls:
      issuerRef:
        name: letsencrypt-prod

apiVersion: v2
name: consulting-spa
description: >-
  consulting-spa — the Dackota Consulting LLC marketing site
  (https://github.com/dackota/consulting-spa), a static single-page site
  served by unprivileged nginx at consulting.dackota.com. A thin OCI
  dependency on the published generic-app-chart, following the same
  app-owned routing/TLS model as change-tracking-dashboard: Deployment,
  Service, HTTPRoute, and cert-manager Certificate all rendered by the
  chart from this app's values, reachable over HTTPS through the shared
  Gateway. Stateless — no PVC, no config beyond the image itself.
type: application
version: 0.1.0
dependencies:
  - name: generic-app-chart
    version: 0.4.0
    repository: oci://ghcr.io/dackota/charts

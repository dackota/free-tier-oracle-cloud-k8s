# consulting-spa: the Dackota Consulting LLC marketing site
# (ghcr.io/dackota/consulting-spa) at consulting.dackota.com — a stateless
# static site on unprivileged nginx, deployed fresh onto generic-app-chart
# (no bespoke-chart migration, so no nameOverride needed; contrast
# change-tracking-dashboard). Values nest under the `generic-app-chart:`
# dependency key (Helm's standard subchart-values convention).
generic-app-chart:
  # Keeps every rendered resource named "consulting-spa" instead of the
  # chart's default "consulting-spa-generic-app-chart" (R2: <release>-<chart>).
  fullnameOverride: consulting-spa

  image:
    # Renovate tracks this tag via its built-in helm-values manager; new
    # releases of dackota/consulting-spa (tag v*) publish this image.
    repository: ghcr.io/dackota/consulting-spa
    tag: "0.1.1"

  # The image's nginx.conf keeps pid/temp paths under /tmp specifically so
  # the chart's strict defaults (arbitrary non-root uid,
  # readOnlyRootFilesystem, automatic /tmp emptyDir) apply unmodified — no
  # podSecurityContext/containerSecurityContext overrides here.

  # Static files from memory; tiny footprint on the capacity-constrained
  # free-tier node, matching the repo-wide small-requests pattern.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  service:
    ports:
      - name: http
        port: 8080
        targetPort: 8080
        protocol: TCP

  # /healthz is a dedicated no-log probe endpoint in the image's nginx.conf.
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10

  # Expose over HTTPS through the lab's one shared Traefik Gateway, in this
  # app's own namespace (ADR 0001 app-owned routing/TLS model). DNS already
  # resolves via the existing wildcard record.
  routing:
    enabled: true
    hostnames:
      - consulting.dackota.com
    gateway:
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
    tls:
      issuerRef:
        name: letsencrypt-prod

apiVersion: v2
name: nautobot-postgres
description: >-
  PostgreSQL for Nautobot — the backing database for the `nautobot` workload,
  consumed as a thin OCI dependency on the published generic-app-chart. Runs
  the official upstream postgres image rather than the Bitnami subchart bundled
  with the Nautobot chart, which is pinned to a bitnamilegacy/postgresql 15.4.0
  image frozen in 2023 that will never receive another security patch. Syncs
  into the shared `nautobot` namespace alongside nautobot and nautobot-redis so
  the chart's default same-namespace NetworkPolicy allowance covers Nautobot's
  access with no extra rules. Cluster-internal only — no HTTPRoute, no
  Certificate.
type: application
version: 0.1.0
dependencies:
  - name: generic-app-chart
    version: 3.0.0
    repository: oci://ghcr.io/dackota/charts

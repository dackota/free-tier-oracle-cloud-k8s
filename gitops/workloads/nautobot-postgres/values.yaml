# PostgreSQL for Nautobot. A fresh workload, not a migration off a bespoke
# chart, so there is no pre-existing immutable Deployment selector to preserve
# and no nameOverride is needed (unlike change-tracking-dashboard). Values nest
# under the `generic-app-chart:` dependency key.
generic-app-chart:
  fullnameOverride: nautobot-postgres

  image:
    # Renovate tracks this via its built-in helm-values manager (the
    # repository/tag pair is all it needs) and pins a digest alongside it per
    # pinDigests from config:best-practices. Do NOT add a custom regex manager
    # for this line — double-managing it is what broke digest pinning on
    # change-tracking-dashboard.
    #
    # `17-alpine` floats within the PostgreSQL 17 series, which is exactly what
    # we want: 17.x patches are drop-in, and the digest pin makes each one an
    # explicit reviewable commit. A major bump (18-alpine) is NOT drop-in — it
    # needs a pg_upgrade or a dump/restore — but Renovate classifies it as a
    # major update, which the workloads auto-merge tier deliberately excludes,
    # so it lands as a manual PR.
    repository: postgres
    tag: "17-alpine"

  env:
    - name: POSTGRES_DB
      value: nautobot
    - name: POSTGRES_USER
      value: nautobot
    # PGDATA MUST be a subdirectory of the mount, not the mount itself.
    # Longhorn formats the volume ext4, which leaves a `lost+found` directory
    # at the root, and `initdb` refuses to initialise a non-empty directory.
    - name: PGDATA
      value: /data/pgdata
    # The `nautobot-db-auth` Secret is created out of band by
    # scripts/bootstrap-nautobot-secrets.sh — this repo is public and has no
    # secrets-management component (ADR 0003), and generic-app-chart never
    # renders a Secret by design. The same Secret's `password` key is what the
    # nautobot chart reads via nautobot.db.existingSecret.
    #
    # Named `-auth`, not `nautobot-db`: the Nautobot chart renders a Secret at
    # that exact name in some configurations, and ArgoCD would overwrite the
    # real credentials with it. See the note in ../nautobot/values.yaml.
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nautobot-db-auth
          key: password

  service:
    ports:
      - name: postgres
        port: 5432
        targetPort: 5432
        protocol: TCP

  # Readiness only — no liveness probe. A liveness probe on a database is a
  # foot-gun: a slow query or a long checkpoint can trip it and restart a
  # healthy primary mid-write. pg_isready is the cheap, purpose-built check and
  # is enough to gate the Service endpoint.
  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - nautobot
        - -d
        - nautobot
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  # The official postgres alpine image runs as uid/gid 70 (the Debian variants
  # use 999 — verified with `docker run --rm postgres:17-alpine id postgres`).
  # fsGroup 70 is what makes the freshly provisioned Longhorn volume writable
  # by the postgres user, and it is also why the image's entrypoint can skip
  # its root-only chown path and run non-root end to end.
  podSecurityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70

  # The chart's restricted default keeps readOnlyRootFilesystem: true. Postgres
  # needs exactly one writable path outside its data volume — the unix socket
  # directory — so it gets an emptyDir rather than an opt-out of the whole
  # read-only rootfs. (/tmp is already provided by the chart.)
  extraEmptyDirs:
    - name: postgres-run
      mountPath: /var/run/postgresql

  # Enabling persistence forces the chart to `strategy: Recreate` and
  # `replicas: 1`, which is correct and required here: a Longhorn RWO volume
  # cannot be multi-attached, and two postgres processes over one data
  # directory would corrupt it.
  persistence:
    enabled: true
    size: 8Gi
    storageClass: longhorn
    mountPath: /data

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Cluster-internal only — a database is never attached to the shared Traefik
  # Gateway. Reach it for maintenance with:
  #   kubectl -n nautobot port-forward svc/nautobot-postgres 5432:5432
  routing:
    enabled: false

  # networkPolicy is left at the chart default (enabled, default-deny-ingress
  # with allowSameNamespace: true), which permits the Nautobot web/worker/beat
  # pods — they share this namespace — and nothing else in the cluster.

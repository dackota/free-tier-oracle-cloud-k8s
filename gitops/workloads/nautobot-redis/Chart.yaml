apiVersion: v2
name: nautobot-redis
description: >-
  Redis for Nautobot — the Celery broker and Django cache for the `nautobot`
  workload, consumed as a thin OCI dependency on the published
  generic-app-chart. Runs the official upstream redis image rather than the
  Bitnami subchart bundled with the Nautobot chart, which is pinned to a
  bitnamilegacy/redis image frozen in 2024 that will never receive another
  security patch. Syncs into the shared `nautobot` namespace alongside nautobot
  and nautobot-postgres. Deliberately has no volume — broker and cache state is
  disposable. Cluster-internal only — no HTTPRoute, no Certificate.
type: application
version: 0.1.0
dependencies:
  - name: generic-app-chart
    version: 3.0.0
    repository: oci://ghcr.io/dackota/charts

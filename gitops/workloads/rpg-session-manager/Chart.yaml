apiVersion: v2
name: rpg-session-manager
description: >-
  rpg-session-manager (Cosmere Session Runner) — a single-file GM screen for
  running tabletop sessions at the table, consumed as a thin OCI dependency on
  the published generic-app-chart. Runs the repo's own launcher.mjs rather
  than a static file server, so the session pick-list, runtime state and
  authored-file writes all work; the chart-owned Longhorn claim mounts at the
  launcher's content directory and is seeded from the image on first start.
  Cluster-internal only — no HTTPRoute or Certificate, reached via
  `kubectl port-forward`.
type: application
version: 0.1.0
dependencies:
  - name: generic-app-chart
    version: 3.0.0
    repository: oci://ghcr.io/dackota/charts
